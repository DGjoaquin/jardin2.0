<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Administrar comunicados</title>
    <link rel="stylesheet" href="assets/css/iglesia.css">
</head>

<body class="pagina-comunicados">
<header class="encabezado">
    <div class="contenedor-logo">
        <div class="texto-header">
            <h1 class="logo">Administrar Comunicados</h1>
            <p class="subtitulo">Crear nuevos avisos para el jardín</p>
        </div>
    </div>
</header>

<section class="seccion-info">
    <div class="container">

        <div class="bloque">
            <h2>Crear comunicado</h2>

            <form id="form-comunicado">

                <input type="text" id="titulo" placeholder="Título">
                <small id="error-titulo" class="error"></small>

                <input type="text" id="descripcion" placeholder="Descripción">
                <small id="error-descripcion" class="error"></small>

                <input type="text" id="categoria" placeholder="Categoría">
                <small id="error-categoria" class="error"></small>

                <button type="submit" class="btn" id="btn-enviar">Guardar</button>

            </form>
        </div>

        <div style="margin-top: 20px;">
            <a href="jardin.html" class="btn">⬅ Volver al inicio</a>
        </div>

    </div>
</section>

<script src="assets/js/comunicados-admin.js"></script>

</body>
</html>
